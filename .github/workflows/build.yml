name: ClipHUB CI

# Tests run on every pull request into develop/main and on every push to main.
# Installers are built on push to main, on version tags (v*) and by hand (workflow_dispatch).
# A tag push also publishes a GitHub Release with stable asset names, which the README links to.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Stdlib unittest only: core/ and tasks/ do not import PySide6, so nothing is installed here.
      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v

  build:
    name: Build (${{ matrix.os }})
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: ClipHUB-Windows.exe
          - os: macos-latest
            artifact: ClipHUB-macOS.dmg
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      # FFmpeg is not bundled yet: the licence (libx264 is GPL) is still a team decision.
      # The app uses ffmpeg from PATH or /opt/homebrew/bin, so the installers work once ffmpeg is installed.
      - name: Build with PyInstaller
        run: pyinstaller --noconfirm packaging/ClipHUB.spec

      - name: Rename Windows executable
        if: runner.os == 'Windows'
        shell: bash
        run: mv dist/ClipHUB.exe dist/ClipHUB-Windows.exe

      - name: Create macOS disk image
        if: runner.os == 'macOS'
        run: hdiutil create -volname ClipHUB -srcfolder dist/ClipHUB.app -ov -format UDZO dist/ClipHUB-macOS.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update the release
        run: |
          gh release create "$GITHUB_REF_NAME" dist/ClipHUB-Windows.exe dist/ClipHUB-macOS.dmg \
            --title "ClipHUB $GITHUB_REF_NAME" --generate-notes \
          || gh release upload "$GITHUB_REF_NAME" dist/ClipHUB-Windows.exe dist/ClipHUB-macOS.dmg --clobber
