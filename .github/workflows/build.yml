name: ClipHUB CI

# Tests run on every pull request into develop/main and on every push to main.
# Installers are built only on push to main or by hand (workflow_dispatch).
on:
  push:
    branches: [main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Stdlib unittest only: core/ and tasks/ do not import PySide6, so nothing is installed here.
      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v

  build:
    name: Build (${{ matrix.os }})
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: ClipHUB-Windows.exe
          - os: macos-latest
            artifact: ClipHUB-macOS.dmg
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      # Fails until scripts/fetch_ffmpeg.py has a real URL and SHA256 for this platform.
      # libx264 is GPL: add --allow-gpl here only after the team accepts that licence.
      - name: Fetch static FFmpeg into bin/
        run: python scripts/fetch_ffmpeg.py

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm packaging/ClipHUB.spec

      - name: Rename Windows executable
        if: runner.os == 'Windows'
        shell: bash
        run: mv dist/ClipHUB.exe dist/ClipHUB-Windows.exe

      - name: Create macOS disk image
        if: runner.os == 'macOS'
        run: hdiutil create -volname ClipHUB -srcfolder dist/ClipHUB.app -ov -format UDZO dist/ClipHUB-macOS.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
